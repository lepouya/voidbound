name: CI

on:
  push:
    branches: [mainline]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install npm dependencies
        run: deno install

      - name: Format check
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Deno tests
        run: deno task test

      - name: Art pipeline tests
        run: python3 -m unittest discover -s tools -v

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build validates that frontendDist exists even for a plain check
      - name: Stub frontend dist
        run: mkdir -p dist

      - name: Rust format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
