name: CI

on:
  push:
    branches: [mainline]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install npm dependencies
        run: deno install

      - name: Format check
        run: deno fmt --check

      # check:ts only — the full `deno task check` also runs cargo check, which
      # the separate rust job covers (with the Tauri system deps it needs).
      - name: Type check
        run: deno task check:ts

      # lint:ts only — the full `deno task lint` also runs clippy, which the
      # separate rust job covers (with the Tauri system deps it needs).
      - name: Lint
        run: deno task lint:ts

      # test:ts only — the full `deno task test` also runs cargo test, which
      # the separate rust job covers (with the Tauri system deps it needs).
      - name: Deno tests
        run: deno task test:ts

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pillow + an SVG rasterizer (rsvg-convert) for the art pipeline; apt
      # packages sidestep Ubuntu's externally-managed pip restrictions.
      - name: Install art pipeline dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil librsvg2-bin

      # ruff/mypy have no apt package here, so bypass the externally-managed
      # restriction directly (same restriction python3-pil sidesteps above).
      - name: Install Python lint/type-check tools
        run: pip install --break-system-packages ruff mypy

      # format:py/check:py/lint:py equivalents — ruff's own --check flag covers
      # format since `deno task format:py` writes in place.
      - name: Python format check
        run: ruff format --check tools/

      - name: Python type check
        run: mypy tools/

      - name: Python lint
        run: ruff check tools/

      - name: Python tests
        run: python3 -m unittest discover -s tools -v

      # Crash-only smoke test: runs every art/gen_*.sh against the real source
      # SVGs/sheets (deno task gen-art's own glob loop, done here without a
      # Deno install since this job has no other Deno step). Never diff the
      # output against src/assets/ — rsvg-convert's output has byte-level
      # churn even when unchanged (see the gen-art skill), so a diff check
      # here would be permanently flaky; success is just a zero exit code.
      - name: Art pipeline smoke test
        run: |
          for f in art/gen_*.sh; do
            "$f"
          done

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build validates that frontendDist exists even for a plain check
      - name: Stub frontend dist
        run: mkdir -p dist

      - name: Rust format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
