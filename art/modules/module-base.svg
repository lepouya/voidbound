<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256"
  height="256">
  <defs>
    <!-- Cyan & Amber Status Gradients matching Command Module -->
    <linearGradient id="core-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="core-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#cc6600" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Deck & Foundation Void -->

  <!-- Thick Beveled Blast Walls with Cut Corners (4x4 room perimeter) -->
  <path
    d="M 32 12 L 224 12 L 244 32 L 244 224 L 224 244 L 32 244 L 12 224 L 12 32 Z"
    fill="#111827" stroke="#334155" stroke-width="14" />
  <path
    d="M 32 12 L 224 12 L 244 32 L 244 224 L 224 244 L 32 244 L 12 224 L 12 32 Z"
    fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.3" />

  <!-- Floor Plating Grid inside the 4x4 room (64 px cell boundaries) -->
  <line x1="64" y1="12" x2="64" y2="244" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="128" y1="12" x2="128" y2="244" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="192" y1="12" x2="192" y2="244" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="12" y1="64" x2="244" y2="64" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="12" y1="128" x2="244" y2="128" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="12" y1="192" x2="244" y2="192" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />

  <!-- Floor Power Conduits radiating from center hub -->
  <g opacity="0.65">
    <line x1="128" y1="48" x2="128" y2="92" stroke="#00ffff" stroke-width="2"
      stroke-dasharray="6 6" data-anim="dash-conduit" />
    <line x1="128" y1="164" x2="128" y2="208" stroke="#00ffff" stroke-width="2"
      stroke-dasharray="6 6" data-anim="dash-conduit" />
    <line x1="48" y1="128" x2="92" y2="128" stroke="#00ffff" stroke-width="2"
      stroke-dasharray="6 6" data-anim="dash-conduit" />
    <line x1="164" y1="128" x2="208" y2="128" stroke="#00ffff" stroke-width="2"
      stroke-dasharray="6 6" data-anim="dash-conduit" />
  </g>

  <!-- Airlock Pressure Door & Threshold (Bottom Center) -->
  <rect x="104" y="238" width="48" height="16" rx="4" fill="#1e293b"
    stroke="#475569" stroke-width="2" />
  <rect x="110" y="242" width="36" height="8" rx="2" fill="#0f172a"
    stroke="#00d2ff" stroke-width="1.5" opacity="0.6" data-anim="pulse-door" />
  <line x1="128" y1="238" x2="128" y2="254" stroke="#334155"
    stroke-width="1.5" />

  <!-- Wall Diagnostic / Status LEDs -->
  <g>
    <circle cx="64" cy="24" r="3" fill="#00ffff" opacity="0.7"
      data-anim="pulse-1" />
    <circle cx="192" cy="24" r="3" fill="#ffcc00" opacity="0.7"
      data-anim="pulse-2" />
    <circle cx="24" cy="64" r="3" fill="#00ffff" opacity="0.7"
      data-anim="pulse-2" />
    <circle cx="24" cy="192" r="3" fill="#00ffff" opacity="0.7"
      data-anim="pulse-1" />
    <circle cx="232" cy="64" r="3" fill="#ffcc00" opacity="0.7"
      data-anim="pulse-1" />
    <circle cx="232" cy="192" r="3" fill="#00ffff" opacity="0.7"
      data-anim="pulse-2" />
  </g>

  <!-- Structural Floor Plating Accents -->
  <g fill="#1e293b" opacity="0.5" stroke="#334155" stroke-width="1">
    <rect x="40" y="40" width="16" height="16" rx="2" />
    <rect x="200" y="40" width="16" height="16" rx="2" />
    <rect x="40" y="200" width="16" height="16" rx="2" />
    <rect x="200" y="200" width="16" height="16" rx="2" />
  </g>

  <!-- Central Universal Utility / Power Node -->
  <g id="center-hub">
    <!-- Outer support ring -->
    <circle cx="128" cy="128" r="36" fill="#0f172a" stroke="#334155"
      stroke-width="3" />
    <!-- Inner deck ring -->
    <circle cx="128" cy="128" r="28" fill="#1e293b" stroke="#475569"
      stroke-width="1.5" />
    <!-- Rotating confinement / magnetic ring -->
    <circle cx="128" cy="128" r="22" fill="none" stroke="#00ffff"
      stroke-width="2" stroke-dasharray="10 6" opacity="0.75"
      data-anim="rotate-ring" />
    <!-- Core enclosure -->
    <circle cx="128" cy="128" r="14" fill="#0f172a" stroke="#00d2ff"
      stroke-width="2" />
    <!-- Pulsing energy core -->
    <circle cx="128" cy="128" r="7" fill="url(#core-cyan)" opacity="0.85"
      filter="url(#glow-cyan)" data-anim="core-pulse" />
  </g>
</svg>
