<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384"
  height="384">
  <defs>
    <linearGradient id="screen-cyan-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="screen-amber-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#cc6600" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="screen-emerald-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.6" />
    </linearGradient>

    <!-- Office Chair Template (Facing North) -->
    <g id="chair-north">
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#475569"
        stroke-width="1.5" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#334155" stroke-width="2" />
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#334155" stroke-width="2" />
      <rect x="-9" y="-6" width="18" height="14" rx="3" fill="#0f172a"
        stroke="#334155" stroke-width="1.5" />
      <rect x="-10" y="5" width="20" height="7" rx="2" fill="#1e293b"
        stroke="#64748b" stroke-width="1.5" />
      <rect x="-6" y="6" width="12" height="4" rx="1" fill="#3b82f6"
        opacity="0.8" />
      <rect x="-13" y="-3" width="3" height="10" rx="1.5" fill="#334155" />
      <rect x="10" y="-3" width="3" height="10" rx="1.5" fill="#334155" />
    </g>

    <!-- Office Chair Template (Facing South) -->
    <g id="chair-south">
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#475569"
        stroke-width="1.5" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#334155" stroke-width="2" />
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#334155" stroke-width="2" />
      <rect x="-9" y="-8" width="18" height="14" rx="3" fill="#0f172a"
        stroke="#334155" stroke-width="1.5" />
      <rect x="-10" y="-12" width="20" height="7" rx="2" fill="#1e293b"
        stroke="#64748b" stroke-width="1.5" />
      <rect x="-6" y="-10" width="12" height="4" rx="1" fill="#3b82f6"
        opacity="0.8" />
      <rect x="-13" y="-7" width="3" height="10" rx="1.5" fill="#334155" />
      <rect x="10" y="-7" width="3" height="10" rx="1.5" fill="#334155" />
    </g>

    <!-- Office Chair Template (Facing East) -->
    <g id="chair-east">
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#475569"
        stroke-width="1.5" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#334155" stroke-width="2" />
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#334155" stroke-width="2" />
      <rect x="-6" y="-9" width="14" height="18" rx="3" fill="#0f172a"
        stroke="#334155" stroke-width="1.5" />
      <rect x="-12" y="-10" width="7" height="20" rx="2" fill="#1e293b"
        stroke="#64748b" stroke-width="1.5" />
      <rect x="-10" y="-6" width="4" height="12" rx="1" fill="#3b82f6"
        opacity="0.8" />
      <rect x="-3" y="-13" width="10" height="3" rx="1.5" fill="#334155" />
      <rect x="-3" y="10" width="10" height="3" rx="1.5" fill="#334155" />
    </g>

    <!-- Office Chair Template (Facing West) -->
    <g id="chair-west">
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#475569"
        stroke-width="1.5" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#334155" stroke-width="2" />
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#334155" stroke-width="2" />
      <rect x="-8" y="-9" width="14" height="18" rx="3" fill="#0f172a"
        stroke="#334155" stroke-width="1.5" />
      <rect x="5" y="-10" width="7" height="20" rx="2" fill="#1e293b"
        stroke="#64748b" stroke-width="1.5" />
      <rect x="6" y="-6" width="4" height="12" rx="1" fill="#3b82f6"
        opacity="0.8" />
      <rect x="-7" y="-13" width="10" height="3" rx="1.5" fill="#334155" />
      <rect x="-7" y="10" width="10" height="3" rx="1.5" fill="#334155" />
    </g>
  </defs>

  <!-- Foundation Void & Outer Deck -->
  <rect width="384" height="384" fill="#090d16" />
  <rect width="384" height="384" fill="none" stroke="#1e293b" stroke-width="2"
    opacity="0.4" />

  <!-- Tier 2 Expanded Room Architecture (Bounds 32..352, Inner 5x5 area) -->
  <path
    d="M 64 32 L 320 32 L 352 64 L 352 320 L 320 352 L 64 352 L 32 320 L 32 64 Z"
    fill="#111827" stroke="#334155" stroke-width="20" />
  <path
    d="M 64 32 L 320 32 L 352 64 L 352 320 L 320 352 L 64 352 L 32 320 L 32 64 Z"
    fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.35" />

  <!-- Floor Plating Grid inside the 5x5 Room -->
  <line x1="96" y1="32" x2="96" y2="352" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="160" y1="32" x2="160" y2="352" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="224" y1="32" x2="224" y2="352" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="288" y1="32" x2="288" y2="352" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="32" y1="96" x2="352" y2="96" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="32" y1="160" x2="352" y2="160" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="32" y1="224" x2="352" y2="224" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />
  <line x1="32" y1="288" x2="352" y2="288" stroke="#1e293b" stroke-width="2"
    opacity="0.6" />

  <!-- Glowing Floor Data Conduits -->
  <line id="anim-conduit-v" data-anim="dash-v" x1="192" y1="32" x2="192"
    y2="134" stroke="#00d2ff" stroke-width="3" stroke-dasharray="8 8"
    opacity="0.8" />
  <line id="anim-conduit-l" data-anim="dash-l" x1="32" y1="180" x2="134"
    y2="180" stroke="#00d2ff" stroke-width="3" stroke-dasharray="8 8"
    opacity="0.8" />
  <line id="anim-conduit-r" data-anim="dash-r" x1="352" y1="180" x2="250"
    y2="180" stroke="#00d2ff" stroke-width="3" stroke-dasharray="8 8"
    opacity="0.8" />

  <!-- Airlock Pressure Door & Threshold (Bottom Center) -->
  <rect x="168" y="334" width="48" height="18" rx="4" fill="#1e293b"
    stroke="#475569" stroke-width="2" />
  <line x1="172" y1="332" x2="178" y2="352" stroke="#eab308" stroke-width="3" />
  <line x1="180" y1="332" x2="186" y2="352" stroke="#eab308" stroke-width="3" />
  <line x1="188" y1="332" x2="194" y2="352" stroke="#eab308" stroke-width="3" />
  <line x1="196" y1="332" x2="202" y2="352" stroke="#eab308" stroke-width="3" />
  <line x1="204" y1="332" x2="210" y2="352" stroke="#eab308" stroke-width="3" />
  <rect x="186" y="336" width="12" height="14" rx="2" fill="#334155"
    stroke="#64748b" stroke-width="1.5" />

  <!-- EXPANDED BRIDGE WORKSTATIONS & SEATING (6 Consoles + Chairs) -->

  <!-- 1. Captain's Center Executive Station (South of Dais, Facing North) -->
  <g id="captain-station">
    <path d="M 148 246 Q 192 238 236 246 L 228 262 Q 192 254 156 262 Z"
      fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <rect id="screen-pulse-1" data-anim="pulse-1" x="164" y="240" width="56"
      height="7" rx="2" fill="url(#screen-cyan-2)" stroke="#00ffff"
      stroke-width="1" />
    <rect x="150" y="242" width="12" height="6" rx="1.5" fill="#10b981"
      opacity="0.9" />
    <rect x="222" y="242" width="12" height="6" rx="1.5" fill="#ffcc00"
      opacity="0.9" />
    <use href="#chair-north" x="192" y="282" />
  </g>

  <!-- 2. Forward Navigation & Sensor Station (North of Dais, Facing South) -->
  <g id="forward-station">
    <path d="M 148 114 Q 192 122 236 114 L 228 98 Q 192 106 156 98 Z"
      fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <rect id="screen-pulse-2" data-anim="pulse-2" x="164" y="113" width="56"
      height="7" rx="2" fill="url(#screen-emerald-2)" stroke="#10b981"
      stroke-width="1" />
    <rect x="150" y="112" width="12" height="6" rx="1.5" fill="#00d2ff"
      opacity="0.9" />
    <rect x="222" y="112" width="12" height="6" rx="1.5" fill="#ffcc00"
      opacity="0.9" />
    <use href="#chair-south" x="192" y="76" />
  </g>

  <!-- 3. Left Tactical Workstation & Chair (Facing East) -->
  <g id="left-station">
    <path d="M 72 144 Q 82 180 72 216 L 88 208 Q 94 180 88 152 Z" fill="#1e293b"
      stroke="#475569" stroke-width="2" />
    <rect id="screen-pulse-3" data-anim="pulse-1" x="86" y="156" width="6"
      height="48" rx="2" fill="url(#screen-cyan-2)" stroke="#00d2ff"
      stroke-width="1" />
    <use href="#chair-east" x="54" y="180" />
  </g>

  <!-- 4. Right Communications Workstation & Chair (Facing West) -->
  <g id="right-station">
    <path d="M 312 144 Q 302 180 312 216 L 296 208 Q 290 180 296 152 Z"
      fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect id="screen-pulse-4" data-anim="pulse-2" x="292" y="156" width="6"
      height="48" rx="2" fill="url(#screen-amber-2)" stroke="#ffb400"
      stroke-width="1" />
    <use href="#chair-west" x="330" y="180" />
  </g>

  <!-- 5. Southwest Engineering Console & Chair -->
  <g id="sw-station">
    <path d="M 88 274 L 126 274 L 120 288 L 88 288 Z" fill="#1e293b"
      stroke="#475569" stroke-width="1.5" />
    <rect x="94" y="268" width="26" height="6" rx="1" fill="#ffb400"
      opacity="0.85" />
    <use href="#chair-north" x="108" y="306" />
  </g>

  <!-- 6. Southeast Shield/System Console & Chair -->
  <g id="se-station">
    <path d="M 296 274 L 258 274 L 264 288 L 296 288 Z" fill="#1e293b"
      stroke="#475569" stroke-width="1.5" />
    <rect x="264" y="268" width="26" height="6" rx="1" fill="#00d2ff"
      opacity="0.85" />
    <use href="#chair-north" x="276" y="306" />
  </g>

  <!-- CENTRAL TACTICAL TABLE & HOLOGRAM -->
  <circle cx="192" cy="180" r="48" fill="#1e293b" stroke="#64748b"
    stroke-width="3" />
  <circle cx="192" cy="180" r="42" fill="#0f172a" stroke="#00d2ff"
    stroke-width="1.5" opacity="0.7" />

  <!-- Dual Counter-Rotating Holographic Rings above Table -->
  <g id="anim-ring-1" data-anim="rotate-1" transform="rotate(0, 192, 180)">
    <circle cx="192" cy="180" r="34" fill="none" stroke="#00d2ff"
      stroke-width="2.5" stroke-dasharray="14 8 6 8" opacity="0.9" />
    <polygon points="192,146 188,152 196,152" fill="#00ffff" />
  </g>

  <g id="anim-ring-2" data-anim="rotate-2" transform="rotate(0, 192, 180)">
    <circle cx="192" cy="180" r="24" fill="none" stroke="#54e05e"
      stroke-width="2" stroke-dasharray="10 8" />
    <circle cx="216" cy="180" r="3.5" fill="#54e05e" />
    <circle cx="168" cy="180" r="2.5" fill="#54e05e" />
  </g>

  <!-- Core Pulsing Star Center -->
  <circle id="anim-core-star" data-anim="core-scale" cx="192" cy="180" r="13"
    fill="none" stroke="#00ffff" stroke-width="3" opacity="0.75" />
  <circle cx="192" cy="180" r="8" fill="#00d2ff" opacity="0.95" />
  <circle cx="192" cy="180" r="3" fill="#ffffff" />
</svg>
