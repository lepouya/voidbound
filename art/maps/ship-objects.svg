<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1536" width="1536"
  height="1536">
  <defs>
    <!-- Vent Slats Pattern -->
    <pattern id="vent-slats-dark" width="24" height="24"
      patternUnits="userSpaceOnUse">
      <rect width="24" height="10" fill="#1e293b" />
      <rect y="10" width="24" height="14" fill="#090d16" />
    </pattern>
    <pattern id="louvers" width="32" height="16" patternUnits="userSpaceOnUse">
      <rect width="32" height="6" fill="#334155" />
      <rect y="6" width="32" height="10" fill="#111827" />
    </pattern>
  </defs>

  <!-- Transparent Background for Object Sheet -->

  <!-- ========================================================= -->
  <!-- ROW 0: OBJECTS 27, 28, 29 -->
  <!-- ========================================================= -->

  <!-- Index 27: Corner Pipe Elbow Fitting (r=0, c=0) -->
  <g id="obj-27" transform="translate(0, 0)">
    <!-- Vertical and horizontal pipe elbows meeting near bottom-right of wall corner -->
    <path d="M 380,100 L 380,280 L 100,280" fill="none" stroke="#334155"
      stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 380,100 L 380,280 L 100,280" fill="none" stroke="#475569"
      stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 380,100 L 380,280 L 100,280" fill="none" stroke="#64748b"
      stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Flanges & Junction Box -->
    <rect x="350" y="150" width="60" height="32" rx="4" fill="#334155"
      stroke="#64748b" stroke-width="4" />
    <rect x="200" y="250" width="32" height="60" rx="4" fill="#334155"
      stroke="#64748b" stroke-width="4" />
    <circle cx="380" cy="280" r="44" fill="#334155" stroke="#64748b"
      stroke-width="6" />
    <circle cx="380" cy="280" r="20" fill="#1e293b" />
  </g>

  <!-- Index 28: Compact Storage Hatch / Floor Box (r=0, c=1) -->
  <g id="obj-28" transform="translate(512, 0)">
    <!-- Compact centered square (240x240 out of 512) -->
    <rect x="136" y="136" width="240" height="240" rx="12" fill="#4d5055"
      stroke="#334155" stroke-width="12" />
    <rect x="156" y="156" width="200" height="200" rx="6" fill="#606569"
      stroke="#475569" stroke-width="6" />
    <rect x="176" y="176" width="160" height="160" rx="4" fill="#334155"
      stroke="#1e293b" stroke-width="4" />
    <!-- Structural Ribs -->
    <line x1="176" y1="176" x2="336" y2="336" stroke="#475569"
      stroke-width="6" />
    <line x1="336" y1="176" x2="176" y2="336" stroke="#475569"
      stroke-width="6" />
    <!-- Center Latch -->
    <circle cx="256" cy="256" r="28" fill="#4d5055" stroke="#64748b"
      stroke-width="4" />
    <circle cx="256" cy="256" r="12" fill="#1e293b" />
  </g>

  <!-- Index 29: Diagonal Engineering Console (r=0, c=2) -->
  <g id="obj-29" transform="translate(1024, 0)">
    <!-- Sloping top-right to bottom-left corner console -->
    <polygon points="100,80 440,80 480,440 60,440" fill="#555a5e"
      stroke="#334155" stroke-width="12" stroke-linejoin="round" />
    <polygon points="130,110 410,110 440,320 90,320" fill="#111827"
      stroke="#475569" stroke-width="6" stroke-linejoin="round" />
    <!-- Technical Indicator Slits & Louvers -->
    <rect x="140" y="140" width="250" height="24" rx="4" fill="#334155" />
    <rect x="150" y="180" width="230" height="24" rx="4" fill="#334155" />
    <rect x="160" y="220" width="210" height="24" rx="4" fill="#334155" />
    <rect x="170" y="260" width="190" height="24" rx="4" fill="#1e293b" />
    <!-- Lower Access Panel -->
    <rect x="120" y="350" width="280" height="60" rx="6" fill="#5c6165"
      stroke="#64748b" stroke-width="4" />
    <circle cx="160" cy="380" r="8" fill="#64748b" />
    <circle cx="360" cy="380" r="8" fill="#64748b" />
  </g>

  <!-- ========================================================= -->
  <!-- ROW 1: OBJECTS 30, 31, 32 -->
  <!-- ========================================================= -->

  <!-- Index 30: Round Floor Vent / Grating (r=1, c=0) -->
  <g id="obj-30" transform="translate(0, 512)">
    <!-- 360x360 round vent centered -->
    <circle cx="256" cy="256" r="180" fill="#4a4d52" stroke="#334155"
      stroke-width="12" />
    <circle cx="256" cy="256" r="150" fill="url(#vent-slats-dark)"
      stroke="#475569" stroke-width="8" />
    <!-- Spokes -->
    <line x1="256" y1="106" x2="256" y2="406" stroke="#334155"
      stroke-width="12" />
    <line x1="106" y1="256" x2="406" y2="256" stroke="#334155"
      stroke-width="12" />
    <line x1="150" y1="150" x2="362" y2="362" stroke="#334155"
      stroke-width="8" />
    <line x1="362" y1="150" x2="150" y2="362" stroke="#334155"
      stroke-width="8" />
    <!-- Center Hub -->
    <circle cx="256" cy="256" r="44" fill="#494c51" stroke="#64748b"
      stroke-width="6" />
    <circle cx="256" cy="256" r="18" fill="#111827" />
  </g>

  <!-- Index 31: Wide Heavy Metallic Container (r=1, c=1) -->
  <g id="obj-31" transform="translate(512, 512)">
    <!-- 420x360 wide container with metallic grey armor plates (#9c9d97) -->
    <rect x="46" y="76" width="420" height="360" rx="16" fill="#9c9d97"
      stroke="#475569" stroke-width="12" />
    <rect x="70" y="100" width="372" height="312" rx="8" fill="#828783"
      stroke="#64748b" stroke-width="6" />
    <!-- Reinforced Corner Armor -->
    <polygon points="46,76 130,76 46,160" fill="#64748b" />
    <polygon points="466,76 382,76 466,160" fill="#64748b" />
    <polygon points="46,436 130,436 46,352" fill="#64748b" />
    <polygon points="466,436 382,436 466,352" fill="#64748b" />
    <!-- Center Paneling & Clasps -->
    <rect x="120" y="150" width="272" height="212" rx="6" fill="#606569"
      stroke="#475569" stroke-width="6" />
    <line x1="120" y1="256" x2="392" y2="256" stroke="#475569"
      stroke-width="10" />
    <rect x="236" y="226" width="40" height="60" rx="4" fill="#9c9d97"
      stroke="#334155" stroke-width="4" />
  </g>

  <!-- Index 32: Tall Server Bank / Equipment Rack (r=1, c=2) -->
  <g id="obj-32" transform="translate(1024, 512)">
    <!-- 360x440 tall equipment rack -->
    <rect x="76" y="36" width="360" height="440" rx="12" fill="#59585d"
      stroke="#334155" stroke-width="12" />
    <rect x="100" y="60" width="312" height="392" rx="6" fill="#475569"
      stroke="#64748b" stroke-width="6" />
    <!-- 4 Bays of Ventilation Louvers -->
    <rect x="126" y="86" width="260" height="68" rx="4" fill="url(#louvers)"
      stroke="#334155" stroke-width="4" />
    <rect x="126" y="174" width="260" height="68" rx="4" fill="url(#louvers)"
      stroke="#334155" stroke-width="4" />
    <rect x="126" y="262" width="260" height="68" rx="4" fill="url(#louvers)"
      stroke="#334155" stroke-width="4" />
    <rect x="126" y="350" width="260" height="68" rx="4" fill="url(#louvers)"
      stroke="#334155" stroke-width="4" />
    <!-- Subtle Status Indicator dots -->
    <circle cx="360" cy="120" r="6" fill="#64748b" />
    <circle cx="360" cy="208" r="6" fill="#64748b" />
    <circle cx="360" cy="296" r="6" fill="#64748b" />
    <circle cx="360" cy="384" r="6" fill="#64748b" />
  </g>

  <!-- ========================================================= -->
  <!-- ROW 2: OBJECTS 33, 34, 35 -->
  <!-- ========================================================= -->

  <!-- Index 33: Horizontal Dual-Pipe Conduit Span (r=2, c=0) -->
  <g id="obj-33" transform="translate(0, 1024)">
    <!-- Spans horizontally full width across the bottom half of the tile (512x340) -->
    <path d="M 0,180 L 512,180" stroke="#334155" stroke-width="64"
      stroke-linecap="butt" />
    <path d="M 0,180 L 512,180" stroke="#6c7675" stroke-width="48"
      stroke-linecap="butt" />
    <path d="M 0,180 L 512,180" stroke="#828783" stroke-width="16"
      stroke-linecap="butt" />

    <path d="M 0,340 L 512,340" stroke="#334155" stroke-width="64"
      stroke-linecap="butt" />
    <path d="M 0,340 L 512,340" stroke="#6e7877" stroke-width="48"
      stroke-linecap="butt" />
    <path d="M 0,340 L 512,340" stroke="#828783" stroke-width="16"
      stroke-linecap="butt" />

    <!-- Bridging Brackets & Flanges -->
    <rect x="80" y="148" width="56" height="224" rx="6" fill="#475569"
      stroke="#334155" stroke-width="6" />
    <rect x="376" y="148" width="56" height="224" rx="6" fill="#475569"
      stroke="#334155" stroke-width="6" />
    <circle cx="108" cy="180" r="10" fill="#1e293b" />
    <circle cx="108" cy="340" r="10" fill="#1e293b" />
    <circle cx="404" cy="180" r="10" fill="#1e293b" />
    <circle cx="404" cy="340" r="10" fill="#1e293b" />
  </g>

  <!-- Index 34: Vertical Machinery Column / Cross-Fitting (r=2, c=1) -->
  <g id="obj-34" transform="translate(512, 1024)">
    <!-- Central vertical column spanning full height (440x512) -->
    <path d="M 256,0 L 256,512" stroke="#334155" stroke-width="120"
      stroke-linecap="butt" />
    <path d="M 256,0 L 256,512" stroke="#556877" stroke-width="96"
      stroke-linecap="butt" />
    <path d="M 256,0 L 256,512" stroke="#64748b" stroke-width="32"
      stroke-linecap="butt" />

    <!-- Horizontal structural crossbeams -->
    <path d="M 46,256 L 466,256" stroke="#334155" stroke-width="100"
      stroke-linecap="round" />
    <path d="M 56,256 L 456,256" stroke="#475569" stroke-width="76"
      stroke-linecap="round" />

    <!-- Central Junction Casing -->
    <rect x="176" y="176" width="160" height="160" rx="24" fill="#334155"
      stroke="#64748b" stroke-width="8" />
    <circle cx="256" cy="256" r="56" fill="#1e293b" stroke="#475569"
      stroke-width="8" />
    <circle cx="256" cy="256" r="24" fill="#556877" />
  </g>

  <!-- Index 35: Corner Utility Pod / Power Relay (r=2, c=2) -->
  <g id="obj-35" transform="translate(1024, 1024)">
    <!-- 380x380 concentric pod tucked in bottom right -->
    <circle cx="280" cy="280" r="190" fill="#334155" stroke="#1e293b"
      stroke-width="12" />
    <circle cx="280" cy="280" r="160" fill="#828783" stroke="#64748b"
      stroke-width="8" />
    <circle cx="280" cy="280" r="110" fill="#606569" stroke="#475569"
      stroke-width="6" />
    <!-- Radiating Conduits -->
    <line x1="280" y1="90" x2="280" y2="170" stroke="#334155" stroke-width="20"
      stroke-linecap="round" />
    <line x1="280" y1="470" x2="280" y2="390" stroke="#334155" stroke-width="20"
      stroke-linecap="round" />
    <line x1="90" y1="280" x2="170" y2="280" stroke="#334155" stroke-width="20"
      stroke-linecap="round" />
    <line x1="470" y1="280" x2="390" y2="280" stroke="#334155" stroke-width="20"
      stroke-linecap="round" />
    <!-- Center Core -->
    <circle cx="280" cy="280" r="54" fill="#475569" stroke="#64748b"
      stroke-width="6" />
    <circle cx="280" cy="280" r="24" fill="#1e293b" />
  </g>
</svg>
